name: Cloudflare Pages deployment
on:
  workflow_dispatch:
  workflow_run:
    workflows: [Quality gates]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: production-pages
  cancel-in-progress: false
jobs:
  deploy:
    if: >-
      ${{ vars.CLOUDFLARE_PAGES_PROJECT != '' && vars.PUBLIC_SITE_URL != '' &&
          (github.event_name == 'workflow_dispatch' ||
          (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.event == 'push')) }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          if test -f package-lock.json; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
      - name: Validate site URL, build, and audit static output
        env:
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
        run: |
          npm run verify:release
          npm run build
          npm run verify:build
      - name: Deploy static assets to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=main
